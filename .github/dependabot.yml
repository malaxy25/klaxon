version: 2
updates:
  # npm-Abhaengigkeiten (Monorepo-Root deckt die Workspaces mit ab)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # kleine Updates zu EINEM PR buendeln (wenig Rauschen); Majors kommen einzeln
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 = Go-native Compiler ohne stabile API; Svelte/Vite-Tooling nutzt sie
      # erst ab TS 7.1+. Major zurueckstellen, bis die Tools nachziehen.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node an die Docker-Runtime (Node 26) koppeln -> keine 27er Majors, bis Node nachzieht.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # GitHub-Actions in .github/workflows aktuell halten
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
