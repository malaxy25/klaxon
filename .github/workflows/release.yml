name: Release
# Automatic versioning - no version number in any file (same scheme as office-darts).
#
# Runs when CI has finished green for a push to main. If the app changed since the last tag
# (APP_PATHS), the next version is derived from that tag and published as tag + GitHub Release
# on exactly the tested commit:
#   default            -> patch +1   (v0.8.62 -> v0.8.63)
#   "[minor]" in a commit subject since the last tag -> minor +1, "[major]" -> major +1
# Release notes = the commit subjects since the last tag.
# The client footer and frehner.tech read releases/latest. Render deploys every push by itself.

on:
  workflow_run:
    workflows: ["CI"]   # must match the name in ci.yml exactly
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # create tag + release

concurrency:
  group: release    # one at a time, so two quick pushes never compute the same version
  cancel-in-progress: false

env:
  APP_NAME: Klaxon
  APP_PATHS: packages Dockerfile package.json package-lock.json .node-version

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}   # exactly the tested commit
          fetch-depth: 0   # all commits + tags

      - name: Next version
        id: v
        run: |
          set -euo pipefail
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "HEAD is already released"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          range="${last:+$last..}HEAD"
          if [ -n "$last" ] && git diff --quiet "$last" HEAD -- $APP_PATHS; then
            echo "No app changes since $last"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          IFS=. read -r ma mi pa <<< "${last:-v0.0.0}"; ma=${ma#v}
          subjects=$(git log --no-merges --format=%s "$range")
          if grep -qi '\[major\]' <<< "$subjects"; then ma=$((ma+1)); mi=0; pa=0
          elif grep -qi '\[minor\]' <<< "$subjects"; then mi=$((mi+1)); pa=0
          else pa=$((pa+1)); fi
          version="$ma.$mi.$pa"
          printf '%s\n' "$subjects" | sed -E 's/ *\[(minor|major)\]//I; s/^/- /' > notes.md
          printf '\nPlay: https://klaxon.frehner.tech\n' >> notes.md
          echo "$last -> v$version"; cat notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Publish tag + release
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release create "v$VERSION" --target "$SHA" --title "$APP_NAME $VERSION" --notes-file notes.md --latest
